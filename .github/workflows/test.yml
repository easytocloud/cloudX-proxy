name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install project and dev tools
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check --output-format=github cloudx_proxy tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev tools
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      - name: Check the package imports without being built
        # cloudx_proxy/_version.py is generated by setuptools_scm and is not
        # committed, so a plain source checkout must still import
        run: |
          rm -f cloudx_proxy/_version.py
          uv run --no-sync python -c "import cloudx_proxy; print(cloudx_proxy.__version__)"
